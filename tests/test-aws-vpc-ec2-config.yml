name: Test AWS VPC and EC2 Configuration Inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          # Required inputs
          tf_state_file_name: test-state
          tf_state_bucket: test-bucket
          # AWS config
          aws_access_key_id: fake-key
          aws_secret_access_key: fake-secret
          aws_session_token: fake-session-token
          aws_resource_identifier: test-resource-id
          aws_additional_tags: '{"env":"test"}'
          # EC2 config
          aws_ec2_ami_filter: 'ubuntu/images/hvm-ssd/ubuntu-jammy-22.04-amd64-server-*'
          aws_ec2_ami_owner: '099720109477'
          aws_ec2_ami_id: 'ami-12345678'
          aws_ec2_ami_update: 'false'
          aws_ec2_iam_instance_profile: 'test-profile'
          aws_ec2_instance_root_vol_preserve: 'false'
          aws_ec2_security_group_name: 'test-sg'
          aws_ec2_create_keypair_sm: 'false'
          aws_ec2_port_list: '[3011,11434]'
          aws_ec2_additional_tags: '{"ec2":"test"}'
          # VPC config
          aws_vpc_create: 'true'
          aws_vpc_name: 'test-vpc'
          aws_vpc_cidr_block: '10.0.0.0/16'
          aws_vpc_public_subnets: '10.10.110.0/24'
          aws_vpc_private_subnets: '10.10.120.0/24'
          aws_vpc_availability_zones: 'us-east-1a'
          aws_vpc_id: 'vpc-12345678'
          aws_vpc_subnet_id: 'subnet-12345678'
          aws_vpc_enable_nat_gateway: 'false'
          aws_vpc_single_nat_gateway: 'false'
          aws_vpc_external_nat_ip_ids: 'eip-12345678'
          aws_vpc_additional_tags: '{"vpc":"test"}'

      - name: Assert action ran or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome '$OUTCOME' (sentinel repo or missing AWS creds expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
