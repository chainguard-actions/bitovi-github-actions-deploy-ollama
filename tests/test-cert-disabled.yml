name: Test cert disabled when aws_no_cert is true
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Call the action under test with aws_no_cert=true and dummy AWS creds.
      # The action will fail at the AWS deployment step (no real credentials),
      # but we use continue-on-error so we can still assert on early-step behavior.
      - id: action
        uses: .
        continue-on-error: true
        with:
          checkout: 'false'
          aws_access_key_id: 'AKIADUMMYKEY00000000'
          aws_secret_access_key: 'dummysecretaccesskey0000000000000000000'
          aws_default_region: 'us-east-1'
          aws_resource_identifier: 'test-ollama-cert-disabled'
          env_aws_secret: 'dummy-secret'
          aws_ec2_ami_filter: 'ubuntu/images/hvm-ssd/ubuntu-*-22.04-amd64-server-*'
          aws_ec2_instance_vol_size: '20'
          aws_domain_name: 'example.com'
          aws_root_domain: 'example.com'
          aws_vpc_cidr_block: '10.0.0.0/16'
          aws_vpc_public_subnets: '10.0.1.0/24'
          aws_vpc_private_subnets: '10.0.2.0/24'
          aws_vpc_availability_zones: 'us-east-1a'
          tf_state_file_name: 'test-cert-disabled'
          tf_state_bucket: 'dummy-tf-state-bucket'
          aws_no_cert: 'true'

      # Verify the cert logic independently: when aws_no_cert=true, enable_cert should NOT be set
      - name: Verify cert disabled logic
        shell: bash
        run: |
          AWS_NO_CERT='true'
          enable_cert=""
          if [ "$AWS_NO_CERT" == "false" ]; then
            enable_cert="true"
          fi
          echo "enable_cert: '$enable_cert'"
          if [ -n "$enable_cert" ]; then
            echo "FAIL: expected enable_cert to be empty when aws_no_cert='true', got '$enable_cert'"
            exit 1
          fi
          echo "PASS: enable_cert is empty as expected when aws_no_cert='true'"
