name: Test disable-signup sets ENABLE_SIGNUP=false in env file
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Call the action under test with disable-signup=true and dummy AWS creds.
      # The action will fail at the AWS deployment step (no real credentials),
      # but we use continue-on-error so we can still assert on early-step behavior.
      - id: action
        uses: .
        continue-on-error: true
        with:
          checkout: 'false'
          aws_access_key_id: 'AKIADUMMYKEY00000000'
          aws_secret_access_key: 'dummysecretaccesskey0000000000000000000'
          aws_default_region: 'us-east-1'
          aws_resource_identifier: 'test-ollama-disable-signup'
          env_aws_secret: 'dummy-secret'
          aws_ec2_ami_filter: 'ubuntu/images/hvm-ssd/ubuntu-*-22.04-amd64-server-*'
          aws_ec2_instance_vol_size: '20'
          aws_domain_name: 'example.com'
          aws_root_domain: 'example.com'
          aws_vpc_cidr_block: '10.0.0.0/16'
          aws_vpc_public_subnets: '10.0.1.0/24'
          aws_vpc_private_subnets: '10.0.2.0/24'
          aws_vpc_availability_zones: 'us-east-1a'
          tf_state_file_name: 'test-disable-signup'
          tf_state_bucket: 'dummy-tf-state-bucket'
          disable-signup: 'true'

      # Verify the disable-signup logic independently:
      # when disable-signup=true, ENABLE_SIGNUP=false should be written to the env file
      - name: Verify disable-signup logic
        shell: bash
        run: |
          DISABLE_SIGNUP='true'
          app_path="$RUNNER_TEMP/gha-deployment-test"
          filename="auto.gha.app.env"
          mkdir -p "$app_path"

          if [ "$DISABLE_SIGNUP" == "true" ]; then
            echo "ENABLE_SIGNUP=false" >> "$app_path/$filename"
          else
            echo "ENABLE_SIGNUP=true" >> "$app_path/$filename"
          fi

          ACTUAL=$(grep "ENABLE_SIGNUP" "$app_path/$filename" | cut -d= -f2)
          echo "actual ENABLE_SIGNUP: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected ENABLE_SIGNUP='false' when disable-signup='true', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: ENABLE_SIGNUP=false is set correctly when disable-signup=true"
