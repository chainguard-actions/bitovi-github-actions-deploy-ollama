name: Test infrastructure_only skips app deployment steps
on:
  workflow_dispatch:

jobs:
  test-infrastructure-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with infrastructure_only true
        id: action
        uses: .
        continue-on-error: true
        with:
          checkout: 'false'
          aws_access_key_id: 'fake-key-id'
          aws_secret_access_key: 'fake-secret-key'
          aws_default_region: 'us-east-1'
          aws_resource_identifier: 'test-ollama-infra-only'
          env_aws_secret: 'fake-secret'
          aws_ec2_instance_vol_size: '20'
          aws_ec2_ami_filter: 'ubuntu/images/hvm-ssd/ubuntu-*-22.04-amd64-server-*'
          aws_no_cert: 'true'
          aws_domain_name: 'example.com'
          aws_root_domain: 'example.com'
          aws_vpc_cidr_block: '10.0.0.0/16'
          aws_vpc_public_subnets: '10.0.1.0/24'
          aws_vpc_private_subnets: '10.0.2.0/24'
          aws_vpc_availability_zones: 'us-east-1a'
          tf_state_file_name: 'test-ollama-infra-only'
          tf_state_bucket: 'fake-tf-state-bucket'
          infrastructure_only: 'true'

      - name: Assert action ran (fails gracefully due to fake AWS credentials)
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake AWS credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert gha-deployment directory was NOT created (infra-only skips app steps)
        if: always()
        run: |
          deploy_dir="$GITHUB_WORKSPACE/gha-deployment"
          echo "Checking that deployment directory was NOT created: $deploy_dir"
          if [ -d "$deploy_dir" ]; then
            echo "FAIL: gha-deployment directory should not exist when infrastructure_only=true"
            exit 1
          fi
          echo "PASS: gha-deployment directory correctly absent in infrastructure_only mode"
