name: Test optional AWS inputs are accepted by the action
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Call the action under test with all optional AWS-related inputs set.
      # The action will fail at the AWS deployment step (no real credentials),
      # but we use continue-on-error so we can still assert on early-step behavior.
      - id: action
        uses: .
        continue-on-error: true
        with:
          checkout: 'false'
          aws_access_key_id: 'AKIADUMMYKEY00000000'
          aws_secret_access_key: 'dummysecretaccesskey0000000000000000000'
          aws_session_token: 'dummysessiontoken0000000000000000000000'
          aws_default_region: 'us-east-1'
          aws_resource_identifier: 'test-ollama-optional-aws'
          aws_extra_tags: 'Project=test,Owner=ci'
          env_aws_secret: 'dummy-secret'
          aws_ec2_ami_filter: 'ubuntu/images/hvm-ssd/ubuntu-*-22.04-amd64-server-*'
          aws_ec2_instance_vol_size: '20'
          aws_ec2_instance_profile: 'dummy-instance-profile'
          aws_ec2_create_keypair_sm: 'true'
          aws_ec2_additional_tags: 'Role=ollama,Env=test'
          aws_domain_name: 'example.com'
          aws_sub_domain: 'ollama'
          aws_root_domain: 'example.com'
          aws_cert_arn: 'arn:aws:acm:us-east-1:123456789012:certificate/dummy-cert-id'
          aws_create_root_cert: 'false'
          aws_create_sub_cert: 'false'
          aws_no_cert: 'false'
          aws_vpc_create: 'false'
          aws_vpc_name: 'test-vpc'
          aws_vpc_cidr_block: '10.0.0.0/16'
          aws_vpc_public_subnets: '10.0.1.0/24'
          aws_vpc_private_subnets: '10.0.2.0/24'
          aws_vpc_availability_zones: 'us-east-1a'
          aws_vpc_id: 'vpc-0dummy00000000000'
          aws_vpc_subnet_id: 'subnet-0dummy0000000000'
          aws_vpc_additional_tags: 'Network=test'
          tf_state_file_name: 'test-optional-aws-inputs'
          tf_state_bucket: 'dummy-tf-state-bucket'

      # Verify the action ran (it will fail due to dummy AWS creds, which is expected)
      - name: Assert action ran and failed gracefully with dummy credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with optional AWS inputs (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
