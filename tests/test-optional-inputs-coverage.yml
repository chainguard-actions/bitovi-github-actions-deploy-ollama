name: Test optional inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          checkout: 'false'
          # AWS Configuration
          aws_access_key_id: 'AKIAIOSFODNN7EXAMPLE'
          aws_secret_access_key: 'wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY'
          aws_session_token: 'FwoGZXIvYXdzEJr//////////fake-session-token'
          aws_default_region: 'us-east-1'
          aws_resource_identifier: 'test-ollama-coverage'
          aws_extra_tags: 'env=test,team=platform'
          # ENV files
          env_aws_secret: 'test-secret'
          env_repo: 'MY_VAR=hello'
          env_ghs: 'GH_SECRET=mysecret'
          env_ghv: 'GH_VAR=myvar'
          # EC2 Instance config
          aws_ec2_instance_type: 'inf1.xlarge'
          aws_ec2_instance_profile: 'my-ec2-instance-profile'
          aws_ec2_create_keypair_sm: 'true'
          aws_ec2_instance_vol_size: '20'
          aws_ec2_additional_tags: 'role=ollama'
          aws_ec2_ami_filter: 'ubuntu/images/hvm-ssd/ubuntu-*-22.04-amd64-server-*'
          infrastructure_only: 'false'
          docker_cloudwatch_skip_destroy: 'false'
          disable-signup: 'false'
          # Stack Management
          tf_stack_destroy: 'false'
          tf_state_file_name: 'test-ollama-state'
          tf_state_file_name_append: 'coverage'
          tf_state_bucket: 'my-terraform-state-bucket'
          tf_state_bucket_destroy: 'false'
          # Domains
          aws_domain_name: 'example.com'
          aws_sub_domain: 'ollama'
          aws_root_domain: 'example.com'
          aws_cert_arn: 'arn:aws:acm:us-east-1:123456789012:certificate/fake-cert-arn'
          aws_create_root_cert: 'false'
          aws_create_sub_cert: 'false'
          aws_no_cert: 'false'
          # VPC Inputs
          aws_vpc_create: 'false'
          aws_vpc_name: 'my-test-vpc'
          aws_vpc_cidr_block: '10.0.0.0/16'
          aws_vpc_public_subnets: '10.0.1.0/24'
          aws_vpc_private_subnets: '10.0.2.0/24'
          aws_vpc_availability_zones: 'us-east-1a'
          aws_vpc_id: 'vpc-0123456789abcdef0'
          aws_vpc_subnet_id: 'subnet-0123456789abcdef0'
          aws_vpc_additional_tags: 'network=test'

      - name: Assert action ran (outputs set, or failed gracefully without real AWS credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VM_URL: ${{ steps.action.outputs.vm_url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "vm_url: $VM_URL"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without real AWS credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
