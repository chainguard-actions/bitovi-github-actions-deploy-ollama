name: Test optional Terraform and environment inputs are accepted by the action
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Call the action under test with optional Terraform and environment inputs set.
      # The action will fail at the AWS deployment step (no real credentials),
      # but we use continue-on-error so we can still assert on early-step behavior.
      - id: action
        uses: .
        continue-on-error: true
        with:
          checkout: 'false'
          aws_access_key_id: 'AKIADUMMYKEY00000000'
          aws_secret_access_key: 'dummysecretaccesskey0000000000000000000'
          aws_default_region: 'us-east-1'
          aws_resource_identifier: 'test-ollama-optional-tf-env'
          env_aws_secret: 'dummy-secret'
          env_repo: 'MY_REPO_VAR=repo-value'
          env_ghs: 'MY_GH_SECRET=gh-secret-value'
          env_ghv: 'MY_GH_VAR=gh-var-value'
          aws_ec2_ami_filter: 'ubuntu/images/hvm-ssd/ubuntu-*-22.04-amd64-server-*'
          aws_ec2_instance_vol_size: '20'
          aws_domain_name: 'example.com'
          aws_root_domain: 'example.com'
          aws_vpc_cidr_block: '10.0.0.0/16'
          aws_vpc_public_subnets: '10.0.1.0/24'
          aws_vpc_private_subnets: '10.0.2.0/24'
          aws_vpc_availability_zones: 'us-east-1a'
          tf_state_file_name: 'test-optional-tf-env'
          tf_state_file_name_append: 'ci-run'
          tf_state_bucket: 'dummy-tf-state-bucket'
          tf_state_bucket_destroy: 'false'

      # Verify the action ran (it will fail due to dummy AWS creds, which is expected)
      - name: Assert action ran and failed gracefully with dummy credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with optional Terraform and env inputs (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
